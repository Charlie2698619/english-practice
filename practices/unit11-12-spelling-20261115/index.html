<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",Inter,Arial,sans-serif;color:#20324a;background:#f4f7fc;--blue:#4775c0;--pale:#eaf1fc;--line:#dbe5f4}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.container{max-width:780px;margin:auto;padding:28px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px 22px}
.brand{display:flex;align-items:center;gap:12px;font-size:14px;color:#62758d;font-weight:650}
.logo{display:grid;place-items:center;width:38px;height:38px;background:#dce8fb;border-radius:12px;color:#3c6caf;font-weight:900;font-size:18px}
.tag{color:#5271a1;background:#e7efff;border-radius:99px;font-size:12px;padding:8px 11px;font-weight:700;white-space:nowrap}
h1{font-size:clamp(24px,4.8vw,34px);line-height:1.35;margin:8px 0 8px;letter-spacing:-.03em}p{line-height:1.75}.subtitle{color:#687c96;margin:0 0 24px;font-size:14px}
.panel{background:white;border:1px solid #e2eaf6;border-radius:22px;box-shadow:0 10px 32px #2e5b9410;padding:clamp(19px,4vw,34px)}
.start-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 14px}
.choice{border:1.5px solid #e0e9f5;background:#fff;border-radius:14px;padding:17px;text-align:left;color:#283c59;min-height:88px}.choice b{font-size:16px;display:block;margin-bottom:6px}.choice small{font-size:12px;color:#7f91a6}.choice.selected{border-color:var(--blue);box-shadow:0 0 0 3px #4775c01c;background:#f8fbff}
.mode-name{font-size:14px;font-weight:750;margin-top:20px}
.primary{border:0;border-radius:13px;background:#4775c0;color:#fff;padding:13px 20px;font-weight:750}.primary:hover{background:#3969b3}.secondary{background:#f4f7fc;color:#426ba7;border:1px solid #dae5f4;border-radius:13px;padding:12px 17px;font-weight:700}.ghost{background:none;color:#6480a4;border:0;padding:10px 0;font-weight:650}.full{width:100%}
.note{font-size:13px;color:#7a8ba1}.hidden{display:none!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#6f83a0;font-size:13px;font-weight:700}
.progress{height:8px;border-radius:8px;background:#e8eef8;overflow:hidden;margin:13px 0 28px}.progress i{height:100%;display:block;background:#6798d9;border-radius:8px;transition:width .2s}
.unit{font-size:12px;color:#5076b4;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:13px}
.prompt{font-size:14px;color:#58718f;font-weight:750;margin-bottom:12px}.sentence{line-height:1.75;font-size:clamp(22px,4.6vw,28px);font-weight:700;letter-spacing:-.012em;min-height:85px}
.blank{color:#648bc9;white-space:nowrap;letter-spacing:3px}.meaning{font-size:15px;border-left:3px solid #90afd9;background:#f5f8fd;border-radius:0 8px 8px 0;padding:12px 15px;margin:14px 0 22px;color:#445f82}
.hint{font-size:13px;color:#7389a7;margin:10px 0 14px}
.answer{width:100%;font-size:19px;letter-spacing:1px;padding:16px;border:1.5px solid #cfddee;border-radius:13px;background:white;outline:none;transition:border .15s}.answer:focus{border-color:#6091d2;box-shadow:0 0 0 3px #6091d21c}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}.actions button{flex:1}.kbd{font-size:12px;color:#90a0b5;text-align:center;margin-top:18px}
.score{font-size:46px;font-weight:850;line-height:1;color:#4373ba;margin:18px 0 8px}.score span{font-size:18px;color:#8da2bc}.summary{font-size:14px;color:#647a96}
.review-list{display:grid;gap:10px;margin:22px 0;max-height:440px;overflow:auto}.review{border:1px solid var(--line);background:#fafcff;border-radius:12px;padding:14px}.review-top{font-weight:700;margin-bottom:5px;font-size:14px}.correct{color:#1b865b}.wrong{color:#c05b52}.review-text{font-size:13px;color:#5b718e;line-height:1.65}.review-expl{font-size:12px;color:#7c8ca4;margin-top:7px}
.info{padding:16px 0;font-size:13px;color:#7286a1}.info strong{color:#4a6d9f}footer{text-align:center;color:#99a7ba;font-size:12px;margin:20px auto}
.teacher{margin-top:24px;border-top:1px dashed #dce6f2;padding-top:22px}
details summary{cursor:pointer;font-weight:750;color:#5275a7;font-size:14px}details p{font-size:13px;color:#7a8eaa}
.word-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}.word-table th,.word-table td{border-bottom:1px solid #eef2f9;padding:10px 7px;text-align:left}.word-table th{color:#6782a5;background:#f6f9fd}.word-table .w{font-weight:750;color:#304e7a}
@media(max-width:500px){header{align-items:flex-start}.start-grid{grid-template-columns:1fr 1fr;gap:9px}.choice{padding:12px;min-height:82px}.choice b{font-size:14px}.container{padding:16px 12px 50px}.panel{border-radius:18px}.actions button{font-size:14px;padding:12px 9px}}

<body><div class="container">
<header><div class="brand"><div class="logo">E</div><span>English Practice<br><small>Vocabulary Spelling</small></span></div><div class="tag">國三單字拼字練習</div></header>
<h1>Unit 11–12 單字拼字練習</h1>
<p class="subtitle">國三程度｜英文例句挖空 × 中文提示 × 首字母提示</p>
<main id="start" class="panel"><div class="mode-name">選擇練習範圍</div><div class="start-grid" id="units"></div><p class="note" id="selectionNote"></p><button class="primary full" id="startBtn">開始拼字練習</button><div class="info"><strong>作答方式：</strong>閱讀英文例句及中文意思，依首字母提示輸入<strong>完整英文單字</strong>。所有題目作答完畢才顯示分數、答案及解析，並可重練錯題。</div></main>
<section id="quiz" class="panel hidden" aria-live="polite"><div class="topline"><span id="questionCount"></span><span id="answeredCount"></span></div><div class="progress"><i id="progressBar"></i></div><div class="unit" id="questionUnit"></div><div class="prompt">請拼出空格中的英文單字</div><div class="sentence" id="questionSentence"></div><div class="meaning" id="questionMeaning"></div><div class="hint" id="questionHint"></div><label for="answer" class="mode-name">你的答案（完整英文拼字）</label><input id="answer" class="answer" type="text" lang="en" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" placeholder="Type the English word" aria-label="輸入完整英文單字"><div class="actions"><button id="backBtn" class="secondary">上一題</button><button id="nextBtn" class="primary">下一題</button></div><div class="kbd">按 Enter 可以前往下一題</div></section>
<section id="results" class="panel hidden"><div class="unit">Practice Complete</div><h2 style="margin:4px 0 0">本次拼字成績</h2><div id="resultScore" class="score"></div><p class="summary" id="resultSummary"></p><div class="actions"><button class="secondary" id="restartBtn">重新練習全部</button><button class="primary" id="wrongBtn">只練錯題</button></div><div id="reviews" class="review-list"></div></section>

<footer>English Teaching Hub · 練習作答後才會顯示答案與解析。成績不會上傳。</footer>
</div>
<script>
const BANK = [{"unit": "11", "word": "forever", "zh": "永遠地", "sentence": "We will remember our best friends _____.", "explanation": "forever 是副詞，表示「永遠地」。", "first": "f", "length": 7}, {"unit": "11", "word": "temporary", "zh": "暫時的；臨時的", "sentence": "The school built a _____ classroom during the repairs.", "explanation": "temporary 是形容詞，可修飾 classroom、job、shelter 等名詞。", "first": "t", "length": 9}, {"unit": "11", "word": "temporarily", "zh": "暫時地", "sentence": "The museum is _____ closed for repairs.", "explanation": "temporarily 是副詞，常用來修飾 closed 等形容詞或動詞。", "first": "t", "length": 11}, {"unit": "11", "word": "maid", "zh": "女傭；侍女", "sentence": "The _____ cleaned the guest room before noon.", "explanation": "maid 是名詞，指女傭或侍女。", "first": "m", "length": 4}, {"unit": "11", "word": "resist", "zh": "抗拒；忍住", "sentence": "I could not _____ eating another piece of chocolate cake.", "explanation": "cannot resist + V-ing，表示忍不住做某事。", "first": "r", "length": 6}, {"unit": "11", "word": "guidance", "zh": "指導；引導", "sentence": "With her teacher’s _____, Amy improved her English.", "explanation": "under someone’s guidance 表示「在某人的指導下」。", "first": "g", "length": 8}, {"unit": "11", "word": "accurate", "zh": "準確的", "sentence": "This clock is still _____ after many years.", "explanation": "accurate 是形容詞；名詞形式為 accuracy。", "first": "a", "length": 8}, {"unit": "11", "word": "sake", "zh": "緣故；理由", "sentence": "For the _____ of your health, you should get more sleep.", "explanation": "for the sake of ... 表示「為了……的緣故」。", "first": "s", "length": 4}, {"unit": "11", "word": "toss", "zh": "扔；擲", "sentence": "Please _____ the empty bottle into the recycling bin.", "explanation": "toss 可以表示輕輕扔或拋。", "first": "t", "length": 4}, {"unit": "11", "word": "reserve", "zh": "預訂；保留", "sentence": "I want to _____ a table for four at the restaurant.", "explanation": "reserve a table / room 表示預訂桌位或房間。", "first": "r", "length": 7}, {"unit": "11", "word": "harbor", "zh": "港口；懷有", "sentence": "Many ships arrived at the _____ before the storm.", "explanation": "harbor 當名詞時表示「港口」。", "first": "h", "length": 6}, {"unit": "11", "word": "dock", "zh": "碼頭；停靠", "sentence": "The boat returned to the _____ before sunset.", "explanation": "dock 作名詞可指碼頭，也可作動詞表示停靠。", "first": "d", "length": 4}, {"unit": "11", "word": "trail", "zh": "小徑；跟蹤", "sentence": "We followed a narrow _____ through the forest.", "explanation": "trail 作名詞可指林間小徑。", "first": "t", "length": 5}, {"unit": "11", "word": "faint", "zh": "微弱的；昏厥", "sentence": "We heard a _____ sound coming from the next room.", "explanation": "faint 當形容詞時表示聲音或光線微弱。", "first": "f", "length": 5}, {"unit": "11", "word": "trace", "zh": "追蹤；蹤跡", "sentence": "The police tried to _____ the missing phone.", "explanation": "trace 作動詞可表示「追查、追蹤」。", "first": "t", "length": 5}, {"unit": "11", "word": "steady", "zh": "穩定的", "sentence": "Keep your hands _____ when you take a photo.", "explanation": "steady 作形容詞，表示穩定的、不晃動的。", "first": "s", "length": 6}, {"unit": "11", "word": "steadily", "zh": "穩定地；不斷地", "sentence": "The rain fell _____ throughout the night.", "explanation": "steadily 是副詞，可表示持續、穩定地。", "first": "s", "length": 8}, {"unit": "11", "word": "stable", "zh": "穩定的", "sentence": "The patient is now in _____ condition.", "explanation": "in stable condition 指「情況穩定」。", "first": "s", "length": 6}, {"unit": "11", "word": "injury", "zh": "受傷；傷害", "sentence": "Kevin missed the game because of a knee _____.", "explanation": "injury 是名詞；動詞是 injure。", "first": "i", "length": 6}, {"unit": "11", "word": "dealer", "zh": "經銷商；業者", "sentence": "My uncle works as a car _____.", "explanation": "car dealer 表示「汽車經銷商」。", "first": "d", "length": 6}, {"unit": "11", "word": "trader", "zh": "交易商；商人", "sentence": "The _____ bought and sold goods in the market.", "explanation": "trader 是名詞，指從事買賣交易的人。", "first": "t", "length": 6}, {"unit": "11", "word": "admire", "zh": "欣賞；欽佩", "sentence": "I really _____ my sister for her courage.", "explanation": "admire someone for something 表示因某事欽佩某人。", "first": "a", "length": 6}, {"unit": "11", "word": "heel", "zh": "腳後跟；鞋跟", "sentence": "The back of my _____ hurt after the long walk.", "explanation": "heel 可指腳後跟或鞋跟。", "first": "h", "length": 4}, {"unit": "11", "word": "satisfactory", "zh": "令人滿意的", "sentence": "The teacher said my report was _____.", "explanation": "satisfactory 是形容詞，表示符合要求、令人滿意的。", "first": "s", "length": 12}, {"unit": "11", "word": "satisfactorily", "zh": "令人滿意地", "sentence": "The students completed the project _____.", "explanation": "satisfactorily 是副詞，修飾動詞 completed。", "first": "s", "length": 14}, {"unit": "11", "word": "splash", "zh": "潑水；濺起水花", "sentence": "Do not _____ water on your classmates.", "explanation": "splash water on someone 表示把水潑到某人身上。", "first": "s", "length": 6}, {"unit": "11", "word": "impress", "zh": "使印象深刻", "sentence": "Her speech will _____ the judges.", "explanation": "impress 是動詞；be impressed with/by ... 表示對……印象深刻。", "first": "i", "length": 7}, {"unit": "11", "word": "melt", "zh": "融化；溶化", "sentence": "The ice cream will _____ in the sun.", "explanation": "melt 可當及物或不及物動詞，表示融化。", "first": "m", "length": 4}, {"unit": "11", "word": "desirable", "zh": "令人嚮往的；理想的", "sentence": "A quiet neighborhood is a _____ place to live.", "explanation": "desirable 是形容詞，表示值得擁有或理想的。", "first": "d", "length": 9}, {"unit": "11", "word": "desire", "zh": "渴望；慾望", "sentence": "Many teenagers _____ more free time after school.", "explanation": "desire 可當動詞表示渴望，也可當名詞。", "first": "d", "length": 6}, {"unit": "11", "word": "badly", "zh": "嚴重地；非常；拙劣地", "sentence": "After the long race, he _____ needed a drink of water.", "explanation": "badly 可表示「非常、迫切地」，如 badly need。", "first": "b", "length": 5}, {"unit": "12", "word": "graduate", "zh": "畢業；畢業生", "sentence": "My brother will _____ from college next year.", "explanation": "graduate from ... 表示從某學校畢業。", "first": "g", "length": 8}, {"unit": "12", "word": "coconut", "zh": "椰子", "sentence": "We drank fresh _____ milk on the island.", "explanation": "coconut 是名詞，表示椰子。", "first": "c", "length": 7}, {"unit": "12", "word": "hesitate", "zh": "猶豫", "sentence": "Do not _____ to ask questions in class.", "explanation": "don’t hesitate to + 原形動詞，表示儘管做某事。", "first": "h", "length": 8}, {"unit": "12", "word": "fist", "zh": "拳頭", "sentence": "The boy raised his _____ in the air.", "explanation": "fist 是名詞，表示拳頭。", "first": "f", "length": 4}, {"unit": "12", "word": "wrist", "zh": "手腕", "sentence": "She hurt her _____ while playing basketball.", "explanation": "wrist 指手腕。", "first": "w", "length": 5}, {"unit": "12", "word": "elbow", "zh": "手肘", "sentence": "He hit his _____ against the door.", "explanation": "elbow 指手肘，也可作動詞表示用手肘推開。", "first": "e", "length": 5}, {"unit": "12", "word": "buzz", "zh": "嗡嗡作響；忙碌地走動", "sentence": "I heard a mosquito _____ near my ear.", "explanation": "buzz 可形容昆蟲或機器發出的嗡嗡聲。", "first": "b", "length": 4}, {"unit": "12", "word": "hum", "zh": "哼唱；嗡嗡聲", "sentence": "My mother likes to _____ a song while cooking.", "explanation": "hum 作動詞可表示輕聲哼唱。", "first": "h", "length": 3}, {"unit": "12", "word": "waterfall", "zh": "瀑布", "sentence": "We saw a beautiful _____ in the mountains.", "explanation": "waterfall 是名詞，指瀑布。", "first": "w", "length": 9}, {"unit": "12", "word": "flood", "zh": "水災；淹沒", "sentence": "The heavy rain caused a serious _____ last night.", "explanation": "flood 是名詞也可作動詞，表示水災或淹水。", "first": "f", "length": 5}, {"unit": "12", "word": "cafeteria", "zh": "自助餐廳", "sentence": "Students eat lunch in the school _____.", "explanation": "cafeteria 指學校或公司常見的自助餐廳。", "first": "c", "length": 9}, {"unit": "12", "word": "dawn", "zh": "黎明", "sentence": "We woke up at _____ to watch the sunrise.", "explanation": "at dawn 表示在黎明時分。", "first": "d", "length": 4}, {"unit": "12", "word": "dusk", "zh": "黃昏", "sentence": "The family returned home at _____.", "explanation": "at dusk 表示「在黃昏時分」。", "first": "d", "length": 4}, {"unit": "12", "word": "bind", "zh": "綁；束縛", "sentence": "Please _____ these papers together with a string.", "explanation": "bind 的三態是 bind–bound–bound。", "first": "b", "length": 4}, {"unit": "12", "word": "dishonest", "zh": "不誠實的", "sentence": "It is _____ to lie to your parents.", "explanation": "dishonest 是 honest（誠實的）的反義詞。", "first": "d", "length": 9}, {"unit": "12", "word": "operation", "zh": "操作；運作；手術", "sentence": "The doctor performed an _____ on the patient.", "explanation": "operation 可表示手術、操作或運作。", "first": "o", "length": 9}, {"unit": "12", "word": "crane", "zh": "起重機；鶴", "sentence": "Workers used a _____ to lift the heavy steel.", "explanation": "crane 可指起重機，也可指鶴。", "first": "c", "length": 5}, {"unit": "12", "word": "basement", "zh": "地下室", "sentence": "We keep our bicycles in the _____.", "explanation": "basement 是名詞，指地下室。", "first": "b", "length": 8}, {"unit": "12", "word": "bet", "zh": "打賭；下注", "sentence": "I _____ you will enjoy this movie.", "explanation": "bet 可表示打賭、相信某事會發生；三態同形。", "first": "b", "length": 3}];
const $=id=>document.getElementById(id);
let active=[], current=0, answers={}, picked=['11','12'], original=[];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderUnits(){const items=[['11','Unit 11'],['12','Unit 12']];$('units').innerHTML=items.map(([v,label])=>`<button class="choice ${picked.includes(v)?'selected':''}" type="button" data-unit="${v}" aria-pressed="${picked.includes(v)}"><b>${label}</b><small>${BANK.filter(q=>q.unit===v).length} 題｜課本標題單字</small></button>`).join('');document.querySelectorAll('[data-unit]').forEach(el=>el.onclick=()=>{const v=el.dataset.unit;picked=picked.includes(v)?picked.filter(x=>x!==v):[...picked,v];renderUnits()});const n=BANK.filter(q=>picked.includes(q.unit)).length;$('selectionNote').textContent=`已選取 ${picked.length} 個單元，共 ${n} 題。`;$('startBtn').disabled=n===0;}
function visible(view){for(const v of ['start','quiz','results'])$(v).classList.toggle('hidden',v!==view);window.scrollTo({top:0,behavior:'instant'});}
function begin(list){active=[...list];original=[...list];answers={};current=0;renderQuestion();visible('quiz');}
function storeAnswer(){const q=active[current];if(q)answers[q.unit+':'+q.word]=$('answer').value.trim();}
function renderQuestion(){const q=active[current];if(!q)return;const id=q.unit+':'+q.word;$('questionCount').textContent=`第 ${current+1} / ${active.length} 題`;$('answeredCount').textContent=`已作答 ${active.filter(z=>(answers[z.unit+':'+z.word]||'').length>0).length} 題`;$('progressBar').style.width=((current+1)/active.length*100)+'%';$('questionUnit').textContent=`Unit ${q.unit} · Spelling`;$('questionSentence').innerHTML=escapeHTML(q.sentence).replace('_____',`<span class="blank">_____</span>`);$('questionMeaning').textContent=`中文提示：${q.zh}`;$('questionHint').textContent=`首字母：${q.first.toUpperCase()} · 共 ${q.length} 個英文字母`;$('answer').value=answers[id]||'';$('backBtn').disabled=current===0;$('nextBtn').textContent=current===active.length-1?'交卷看成績':'下一題';setTimeout(()=>$('answer').focus(),50);}
function next(){storeAnswer();if(current===active.length-1){finish();return;}current++;renderQuestion();}
function finish(){const wrong=active.filter(q=>(answers[q.unit+':'+q.word]||'').toLowerCase()!==q.word.toLowerCase());const ok=active.length-wrong.length;visible('results');$('resultScore').innerHTML=`${ok} <span>/ ${active.length} 題</span>`;$('resultSummary').textContent=`答對 ${ok} 題，答錯或未作答 ${wrong.length} 題。以下為完整答案與解析。`;$('wrongBtn').disabled=wrong.length===0;$('wrongBtn').textContent=wrong.length?`錯題重練（${wrong.length} 題）`:'全部答對';$('wrongBtn').onclick=()=>begin(wrong);$('reviews').innerHTML=active.map((q,i)=>{const ans=answers[q.unit+':'+q.word]||'（未作答）';const good=ans.toLowerCase()===q.word.toLowerCase();return `<div class="review"><div class="review-top">${i+1}. <span class="${good?'correct':'wrong'}">${good?'答對':'答錯'}</span> · ${escapeHTML(q.word)} <small style="color:#899bb2">(Unit ${q.unit})</small></div><div class="review-text">${escapeHTML(q.sentence.replace('_____',q.word))}<br>你的答案：${escapeHTML(ans)} ｜ 正解：<b>${escapeHTML(q.word)}</b><br>中文：${escapeHTML(q.zh)}</div><div class="review-expl">${escapeHTML(q.explanation)}</div></div>`}).join('');}
$('startBtn').onclick=()=>begin(BANK.filter(q=>picked.includes(q.unit)));
$('nextBtn').onclick=next;
$('backBtn').onclick=()=>{if(current>0){storeAnswer();current--;renderQuestion()}};
$('answer').oninput=()=>{const q=active[current];answers[q.unit+':'+q.word]=$('answer').value.trim();$('answeredCount').textContent=`已作答 ${active.filter(z=>(answers[z.unit+':'+z.word]||'').length>0).length} 題`;};
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();next();}});
$('restartBtn').onclick=()=>begin(original);

renderUnits();
</script>
</body></html>
