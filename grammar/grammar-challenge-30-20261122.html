<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國三綜合文法挑戰｜30題</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#1c2b40;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:24px 16px 55px}.muted{color:#68788d}.card{background:white;border:1px solid #dde5ef;border-radius:18px;padding:25px;margin:16px 0;box-shadow:0 5px 18px #17324d0a}h1{font-size:clamp(24px,5vw,32px)}h2{font-size:22px}.pill{display:inline-block;background:#e5efff;color:#245aa3;padding:7px 13px;border-radius:30px;font-size:13px;font-weight:700}.bar{height:8px;background:#e7edf5;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#5c93d4;transition:width .2s}.question{font-size:21px;font-weight:650;line-height:1.6;margin:22px 0}.option{display:block;padding:14px;margin:10px 0;border:1px solid #d9e2ed;border-radius:12px;cursor:pointer;line-height:1.5}.option:has(input:checked){background:#eaf2ff;border-color:#4788d5}.option input{margin-right:10px;accent-color:#2867bf}button{border:0;border-radius:10px;background:#2865bd;color:white;padding:12px 17px;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#eaf0f7;color:#24466f}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:22px}.hidden{display:none}.score{font-size:50px;font-weight:800;color:#235fac}.review{border-top:1px solid #e2e8f1;padding:17px 0;line-height:1.7}.bad{color:#ba413e}.good{color:#187653}.small{font-size:13px}@media(max-width:520px){.card{padding:18px}.question{font-size:19px}.wrap{padding:16px 12px 45px}}</style></head><body><main class="wrap"><span class="pill">Grammar Practice · 30 Questions</span><h1>國三英文綜合文法挑戰</h1><p class="muted">使役動詞與六大句型｜一次一題｜交卷後顯示答案解析</p><section id="intro" class="card"><h2>準備開始</h2><p>30 題四選一選擇題，滿分 100 分。可以返回修改答案，整份交卷後才會顯示解析。</p><p class="muted small">無須登入；不會上傳或儲存個人成績。</p><button onclick="start()">開始測驗</button></section><section id="test" class="card hidden"><div style="display:flex;justify-content:space-between"><span class="pill" id="category">Grammar</span><span id="counter"></span></div><div class="bar"><div class="fill" id="progress"></div></div><div class="question" id="question"></div><div id="choices"></div><div class="actions"><button class="secondary" id="prev" onclick="move(-1)">上一題</button><button id="next" onclick="move(1)">下一題</button><button id="submit" onclick="finish()">交卷並查看成績</button></div><p class="muted small" id="answered"></p></section><section id="results" class="hidden"><div class="card"><h2 id="resultTitle">測驗結果</h2><div class="score" id="score"></div><p id="summary"></p><div class="actions"><button id="retry" onclick="retryWrong()">錯題重練</button><button class="secondary" onclick="restart()">重新挑戰 30 題</button></div></div><div class="card"><h2>逐題答案與解析</h2><div id="reviews"></div></div></section></main><script>const bank=[["My mother made me _____ my room before dinner.",["to clean","clean","cleaning","cleaned"],1,"make + 人 + 原形動詞。"],["The students were made _____ their homework again.",["do","doing","to do","done"],2,"被動語態 be made to V。"],["I had my brother _____ my computer yesterday.",["fix","to fix","fixed","fixing"],0,"have + 人 + 原形動詞。"],["Dad had his car _____ at the garage.",["repair","repairing","to repair","repaired"],3,"have + 物 + 過去分詞。"],["The teacher got the students _____ quietly.",["sit","sitting","to sit","sat"],2,"get + 人 + to V。"],["My parents let me _____ out last night.",["go","to go","going","gone"],0,"let + 人 + 原形動詞。"],["We got the broken window _____ yesterday.",["fix","fixing","fixed","to fix"],2,"get + 物 + p.p.。"],["The children were _____ to play outside after lunch.",["let","allowed","made","had"],1,"let 的被動允許義常以 be allowed to V 表達。"],["The actor is believed _____ very talented.",["be","being","to be","to have been"],2,"現在的狀態用 to be。"],["The writer is said _____ the novel twenty years ago.",["write","to write","writing","to have written"],3,"轉述前已發生的事用 to have p.p.。"],["The house is said _____ haunted now.",["be","to be","being","to have been"],1,"now 表示現在狀態。"],["The team is believed _____ the match last night.",["to win","winning","to have won","won"],2,"last night 已發生，用 to have won。"],["I would rather _____ at home than _____ to the mall.",["stay; go","to stay; go","stay; going","staying; to go"],0,"would rather + VR + than + VR。"],["Which sentence is correct?",["I prefer play tennis to swim.","I prefer playing tennis to swimming.","I prefer playing tennis than swimming.","I prefer to playing tennis rather than swim."],1,"prefer V-ing to V-ing。"],["She would _____ a book rather than watch TV.",["reading","to read","read","reads"],2,"would + VR + rather than + VR。"],["I prefer _____ early rather than _____ late.",["leave; stay","to leave; stay","leaving; stay","to leaving; staying"],1,"prefer to V rather than V。"],["The girl was seen _____ into the classroom.",["walk","walked","to walk","to walking"],2,"see + O + VR 轉被動後用 to VR。"],["When I arrived, a man was heard _____ loudly.",["shout","shouting","to shouted","shouts"],1,"當時正在發生，用 V-ing。"],["The thief was seen _____ over the fence from beginning to end.",["jump","to jump","jumped","to jumping"],1,"完整動作用 be seen to V。"],["The baby was heard _____ when we passed the room.",["cry","cried","crying","to crying"],2,"強調當時正在哭，用 V-ing。"],["Emma never goes to bed without _____ her teeth.",["brush","to brush","brushing","brushed"],2,"without + V-ing。"],["There is no success without _____ hard.",["work","working","to work","worked"],1,"介系詞 without 後用 V-ing。"],["Dad doesn't leave home without _____ the door.",["locking","lock","to lock","locked"],0,"without + V-ing。"],["_____ her homework, Linda went out to play.",["Finish","Having finished","Having been finished","To finishing"],1,"主動完成先發生，用 Having + p.p.。"],["_____ by the teacher, the student became more careful.",["Having warned","Have warned","Having been warned","To warning"],2,"被動且先發生，用 Having been + p.p.。"],["_____ all his money, Ben couldn't buy a ticket.",["Having spent","Having been spent","To spending","Spend"],0,"Ben 主動花完錢，用 Having spent。"],["_____ the final exam, the students felt relieved.",["Having completed","Having been completed","To completing","Complete"],0,"學生主動完成考試，用 Having completed。"],["It wasn't until midnight _____ Jack finished his project.",["when","that","which","where"],1,"It wasn't until...that...。"],["It wasn't until the teacher explained it _____ I understood.",["that","when","then","which"],0,"強調句型使用 that。"],["Which sentence means '直到昨天我才知道真相'?",["It wasn't until yesterday when I knew the truth.","It wasn't until yesterday that I didn't know the truth.","It wasn't until yesterday that I knew the truth.","It wasn't yesterday until I knew the truth."],2,"It wasn't until + 時間 + that + 肯定子句。"]];const categories=['使役動詞','被動轉述','would rather / prefer','感官動詞被動','雙重否定','完成分詞構句','強調時間'];let order=bank.map((_,i)=>i),answers={},index=0,retrying=false;const $=id=>document.getElementById(id);function cat(i){return categories[i<8?0:i<12?1:i<16?2:i<20?3:i<23?4:i<27?5:6]}function show(id){['intro','test','results'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function start(){show('test');render()}function render(){let n=order[index],q=bank[n];$('category').textContent=cat(n);$('counter').textContent=(index+1)+' / '+order.length;$('progress').style.width=((index+1)/order.length*100)+'%';$('question').textContent=q[0];$('choices').replaceChildren();q[1].forEach((opt,j)=>{let label=document.createElement('label');label.className='option';let input=document.createElement('input');input.type='radio';input.name='choice';input.value=j;input.checked=answers[n]===j;input.onchange=()=>{answers[n]=j;renderButtons()};label.append(input,document.createTextNode(' '+String.fromCharCode(65+j)+'. '+opt));$('choices').append(label)});renderButtons()}function renderButtons(){$('prev').disabled=index===0;$('next').classList.toggle('hidden',index===order.length-1);$('submit').classList.toggle('hidden',index!==order.length-1);$('submit').disabled=!order.every(n=>answers[n]!==undefined);$('answered').textContent='已作答 '+order.filter(n=>answers[n]!==undefined).length+' / '+order.length+' 題'}function move(d){index=Math.max(0,Math.min(order.length-1,index+d));render()}function finish(){if(!order.every(n=>answers[n]!==undefined)){alert('請先完成全部題目');return}show('results');let correct=order.filter(n=>answers[n]===bank[n][2]).length;$('resultTitle').textContent=retrying?'錯題重練結果':'測驗結果';$('score').textContent=Math.round(correct/order.length*100)+' / 100';$('summary').textContent='答對 '+correct+' 題，共 '+order.length+' 題';$('reviews').replaceChildren();order.forEach(n=>{let q=bank[n],ok=answers[n]===q[2],d=document.createElement('div');d.className='review';let h=document.createElement('strong');h.textContent=(n+1)+'. '+q[0];let p=document.createElement('p');p.className=ok?'good':'bad';p.textContent=(ok?'答對':'答錯')+'｜你的答案：'+String.fromCharCode(65+answers[n])+'｜正確答案：'+String.fromCharCode(65+q[2])+'. '+q[1][q[2]];let e=document.createElement('div');e.textContent='解析：'+q[3];d.append(h,p,e);$('reviews').append(d)});$('retry').classList.toggle('hidden',order.every(n=>answers[n]===bank[n][2]))}function retryWrong(){order=order.filter(n=>answers[n]!==bank[n][2]);answers={};index=0;retrying=true;start()}function restart(){order=bank.map((_,i)=>i);answers={};index=0;retrying=false;start()}</script></body></html>
