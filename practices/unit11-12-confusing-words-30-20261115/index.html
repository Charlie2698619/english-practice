<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 11–12 易混淆單字挑戰｜30 題練習</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#24354b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:22px 15px 70px}.pill{color:#2861a4;background:#e5efff;padding:6px 12px;border-radius:30px;font-size:12px;font-weight:700}h1{font-size:clamp(24px,5vw,34px);margin:15px 0 7px}p{line-height:1.65}.muted{color:#63748a}.card{background:white;border:1px solid #dce5ef;border-radius:18px;padding:22px;margin:17px 0;box-shadow:0 5px 20px #183a5c09}.small{font-size:13px}.bar{background:#e6edf5;height:8px;border-radius:9px;overflow:hidden}.fill{background:#6b9bd7;height:100%;width:0}.question{font-size:21px;line-height:1.6;font-weight:600;margin:24px 0}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #cbd8e7;color:#23374e;padding:14px 15px;margin:9px 0;border-radius:12px;cursor:pointer;font:inherit}.option.selected{border:2px solid #3e78c5;background:#eaf3ff}input{width:100%;padding:14px;border:1px solid #aebfd2;border-radius:11px;font:inherit;font-size:17px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}button{background:#2865b4;color:white;border:0;border-radius:11px;padding:12px 17px;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#e9eff6;color:#244366}button:disabled{opacity:.4}.result{border-left:4px solid #cf6670;padding:12px;margin:12px 0;background:#fafbfd;border-radius:8px}.result.correct{border-color:#45a381}.answer{font-weight:700;color:#215ca4}.hidden{display:none}.keyitem{padding:10px 0;border-bottom:1px solid #e8edf3}.footer{font-size:12px;color:#718096;margin-top:25px}@media(max-width:500px){.card{padding:17px}.question{font-size:19px}}</style></head>
<body><main class="wrap"><span class="pill">Vocabulary Practice · Unit 11–12</span><h1>Unit 11–12 易混淆單字挑戰</h1><p class="muted">台灣國三｜標準難度｜30 題｜易混淆選擇 10 題、詞性辨識 10 題、句子填空 10 題</p>
<section class="card" id="welcome"><h2>測驗說明</h2><p>選擇題請選出最適合句意的答案；填空題請輸入完整英文單字。每題 1 分，交卷後才顯示正確答案及解析。</p><p class="muted small">交卷後顯示完整答案與解析；成績不會上傳伺服器。</p><div class="actions"><button onclick="start(false)">開始 30 題測驗</button></div><div id="teacherKey" class="hidden"></div></section>
<section class="card hidden" id="quiz"><div class="muted small" id="section"></div><div style="display:flex;justify-content:space-between;margin:8px 0 10px"><strong id="counter"></strong><span class="muted small" id="done"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="stem"></div><div id="response"></div><div class="actions"><button class="secondary" onclick="move(-1)" id="prev">上一題</button><button onclick="move(1)" id="next">下一題</button><button class="secondary" onclick="finish()">交卷並查看解析</button></div></section>
<section class="hidden" id="results"><div class="card"><h2>測驗結果</h2><h1 id="score"></h1><p id="summary"></p><div class="actions"><button onclick="retryWrong()">錯題重練</button><button class="secondary" onclick="restart()">重新開始</button></div></div><div id="review"></div></section>
<div class="footer">Unit 11–12 題目根據本次課本照片與已核對的標題字彙編寫；部分詞性題採用課本列出的衍生字及例句用字。</div></main>
<script>
const BANK=[{"section": "易混淆選擇", "type": "mc", "stem": "The hotel needs a ______ worker for just two weeks.", "answer": "temporary", "options": ["temporary", "permanent", "steadily", "forever"], "explain": "temporary 是形容詞「暫時的」；permanent 表示永久的。"}, {"section": "易混淆選擇", "type": "mc", "stem": "Please check the numbers again. They must be ______.", "answer": "accurate", "options": ["accurate", "inaccurate", "temporary", "faint"], "explain": "accurate 表示「精確的」，符合數字必須正確的語意。"}, {"section": "易混淆選擇", "type": "mc", "stem": "The coach gave us useful ______ before the competition.", "answer": "guidance", "options": ["guidance", "guide", "guided", "guiding"], "explain": "useful 後需要名詞；guidance 是不可數名詞「指導」。"}, {"section": "易混淆選擇", "type": "mc", "stem": "The company is financially ______ and is not likely to close.", "answer": "stable", "options": ["stable", "steadily", "temporarily", "faint"], "explain": "be 動詞後使用形容詞 stable「穩定的」。"}, {"section": "易混淆選擇", "type": "mc", "stem": "I could not ______ laughing when I saw the funny video.", "answer": "resist", "options": ["resist", "hesitate", "admire", "reserve"], "explain": "cannot resist + V-ing 表示忍不住做某事。"}, {"section": "易混淆選擇", "type": "mc", "stem": "We should ______ a table before going to the restaurant.", "answer": "reserve", "options": ["reserve", "resist", "desire", "trace"], "explain": "reserve a table 表示「訂位」。"}, {"section": "易混淆選擇", "type": "mc", "stem": "The detective tried to ______ the missing phone's location.", "answer": "trace", "options": ["trace", "trail", "toss", "splash"], "explain": "trace 表示「追查」位置或來源；trail 偏向跟蹤人或物。"}, {"section": "易混淆選擇", "type": "mc", "stem": "The doctor said my knee ______ was not serious.", "answer": "injury", "options": ["injury", "injure", "injured", "injuring"], "explain": "my knee 後接名詞 injury「傷害」。"}, {"section": "易混淆選擇", "type": "mc", "stem": "The police arrested a ______ who sold stolen cars.", "answer": "dealer", "options": ["dealer", "trader", "graduate", "maid"], "explain": "car dealer 是汽車商；trader 是較廣義的交易商。"}, {"section": "易混淆選擇", "type": "mc", "stem": "The speech made a deep ______ on the audience.", "answer": "impression", "options": ["impression", "impress", "impressive", "impressed"], "explain": "make a deep impression on 是固定搭配，impression 為名詞。"}, {"section": "詞性辨識", "type": "mc", "stem": "The wind blew ______ all night.", "answer": "steadily", "options": ["steady", "steadily", "stable", "stability"], "explain": "修飾動詞 blew 需要副詞 steadily。"}, {"section": "詞性辨識", "type": "mc", "stem": "She completed the project ______.", "answer": "satisfactorily", "options": ["satisfactory", "satisfactorily", "satisfaction", "satisfied"], "explain": "修飾 completed 需使用副詞 satisfactorily。"}, {"section": "詞性辨識", "type": "mc", "stem": "The teacher gave a ______ explanation of the rule.", "answer": "satisfactory", "options": ["satisfactory", "satisfactorily", "satisfaction", "satisfy"], "explain": "修飾名詞 explanation 需使用形容詞 satisfactory。"}, {"section": "詞性辨識", "type": "mc", "stem": "I really ______ people who volunteer to help others.", "answer": "admire", "options": ["admire", "admiration", "admirable", "admiring"], "explain": "主詞 I 後需動詞 admire「欽佩」。"}, {"section": "詞性辨識", "type": "mc", "stem": "He spoke so ______ that I could hardly hear him.", "answer": "faintly", "options": ["faint", "faintly", "faintness", "fainted"], "explain": "修飾 spoke 需副詞 faintly，源自課本標題 faint。"}, {"section": "詞性辨識", "type": "mc", "stem": "The teacher was ______ by the student's progress.", "answer": "impressed", "options": ["impressed", "impressive", "impression", "impress"], "explain": "be impressed by 表示「對……印象深刻」。"}, {"section": "詞性辨識", "type": "mc", "stem": "The ______ of the new machine took several hours.", "answer": "operation", "options": ["operation", "operate", "operational", "operator"], "explain": "定冠詞 The 後、of 前需名詞 operation。"}, {"section": "詞性辨識", "type": "mc", "stem": "The ice began to ______ in the sun.", "answer": "melt", "options": ["melt", "melting", "melted", "meltable"], "explain": "begin to + 原形動詞 melt。"}, {"section": "詞性辨識", "type": "mc", "stem": "He was punished for his ______ behavior.", "answer": "dishonest", "options": ["dishonest", "dishonesty", "honestly", "dishonestly"], "explain": "修飾名詞 behavior 需形容詞 dishonest。"}, {"section": "詞性辨識", "type": "mc", "stem": "She felt ______ after hearing the good news.", "answer": "relieved", "options": ["relieved", "relief", "relieve", "relieving"], "explain": "felt 後接形容詞 relieved「感到寬慰的」，來自 temporarily 的課本例句。"}, {"section": "句子填空", "type": "input", "stem": "Please do not ______ to ask if you need help.", "answer": "hesitate", "options": null, "explain": "do not hesitate to + V：不要猶豫去做某事。"}, {"section": "句子填空", "type": "input", "stem": "The little boy made a big ______ when he jumped into the pool.", "answer": "splash", "options": null, "explain": "make a splash 表示濺起水花，也可引申為引起轟動。"}, {"section": "句子填空", "type": "input", "stem": "The sun rises at ______ and sets in the evening.", "answer": "dawn", "options": null, "explain": "dawn 是黎明；dusk 是黃昏。"}, {"section": "句子填空", "type": "input", "stem": "The sky grew dark at ______.", "answer": "dusk", "options": null, "explain": "dusk 是黃昏，與 dawn「黎明」相對。"}, {"section": "句子填空", "type": "input", "stem": "Use a rope to ______ the boxes together.", "answer": "bind", "options": null, "explain": "bind A together 表示把物品綁在一起。"}, {"section": "句子填空", "type": "input", "stem": "Bees ______ around the flowers in the garden.", "answer": "buzz", "options": null, "explain": "buzz around 表示嗡嗡作響地飛來飛去。"}, {"section": "句子填空", "type": "input", "stem": "The students ate lunch in the school ______.", "answer": "cafeteria", "options": null, "explain": "cafeteria 是學校或公司的自助餐廳。"}, {"section": "句子填空", "type": "input", "stem": "The storm caused a serious ______ in the village.", "answer": "flood", "options": null, "explain": "flood 是洪水、水災；a serious flood 為名詞片語。"}, {"section": "句子填空", "type": "input", "stem": "The children hid in the ______ during the storm.", "answer": "basement", "options": null, "explain": "basement 表示地下室。"}, {"section": "句子填空", "type": "input", "stem": "The old man walked slowly and leaned on the wall to ______ himself.", "answer": "steady", "options": null, "explain": "steady 可作動詞，表示使身體穩住。"}];
let active=BANK.map((_,i)=>i),answers={},idx=0,wrong=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toggleKey(){let e=$('teacherKey');e.classList.toggle('hidden');if(!e.classList.contains('hidden'))e.innerHTML='<h3>教師答案與解析</h3>'+BANK.map((q,i)=>`<div class="keyitem"><b>${i+1}. ${esc(q.answer)}</b> <span class="muted small">(${esc(q.section)})</span><div>${esc(q.stem)}</div><div class="muted small">${esc(q.explain)}</div></div>`).join('');}
function start(retry){if(!retry){active=BANK.map((_,i)=>i);answers={}}idx=0;$('welcome').classList.add('hidden');$('results').classList.add('hidden');$('quiz').classList.remove('hidden');render();}
function render(){const k=active[idx],q=BANK[k];$('section').textContent=q.section;$('counter').textContent=`第 ${idx+1} / ${active.length} 題`;$('done').textContent=`已作答 ${active.filter(k=>String(answers[k]||'').trim()).length} 題`;$('fill').style.width=((idx+1)/active.length*100)+'%';$('stem').textContent=q.stem;$('response').innerHTML=q.type==='mc'?q.options.map((o,i)=>`<button class="option ${answers[k]===o?'selected':''}" data-i="${i}" onclick="selectOption(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join(''):`<label class="muted small" for="input">請輸入完整英文單字</label><input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文單字" value="${esc(answers[k]||'')}">`;$('prev').disabled=idx===0;$('next').disabled=idx===active.length-1;if(q.type==='input'){$('input').addEventListener('input',e=>{answers[k]=e.target.value;$('done').textContent=`已作答 ${active.filter(k=>String(answers[k]||'').trim()).length} 題`});$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&idx<active.length-1)move(1)})}}
function selectOption(i){answers[active[idx]]=BANK[active[idx]].options[i];render();}
function move(d){idx=Math.max(0,Math.min(active.length-1,idx+d));render();window.scrollTo(0,0)}
function isCorrect(k){return String(answers[k]||'').trim().toLowerCase()===BANK[k].answer.toLowerCase()}
function finish(){const blanks=active.filter(k=>!String(answers[k]||'').trim()).length;if(blanks&&!confirm(`還有 ${blanks} 題未作答，確定交卷嗎？`))return;wrong=active.filter(k=>!isCorrect(k));$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('score').textContent=`${active.length-wrong.length} / ${active.length}`;$('summary').textContent=`答對 ${active.length-wrong.length} 題，答錯或未作答 ${wrong.length} 題。`;$('review').innerHTML=active.map((k,i)=>{let q=BANK[k];return `<div class="card result ${isCorrect(k)?'correct':''}"><b>第 ${i+1} 題｜${esc(q.section)}｜${isCorrect(k)?'答對':'需加強'}</b><p>${esc(q.stem)}</p><div>你的答案：${esc(answers[k]||'（未作答）')}</div><div>正確答案：<span class="answer">${esc(q.answer)}</span></div><p class="muted small">${esc(q.explain)}</p></div>`}).join('');window.scrollTo(0,0)}
function retryWrong(){if(!wrong.length){alert('本次全部答對，沒有錯題。');return}active=[...wrong];for(const k of active)delete answers[k];start(true)}
function restart(){active=BANK.map((_,i)=>i);answers={};idx=0;$('results').classList.add('hidden');$('quiz').classList.add('hidden');$('welcome').classList.remove('hidden');window.scrollTo(0,0)}
</script></body></html>
