<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國三英文拼字練習｜40題</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#1d3047;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(24px,5vw,32px);margin:12px 0}p{line-height:1.7;color:#607087}.card{background:white;border:1px solid #dce6f0;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 6px 18px #1234a00b}.pill{display:inline-block;background:#e7f0ff;color:#245eae;padding:7px 13px;border-radius:24px;font-size:13px;font-weight:700}.bar{height:8px;background:#e6edf5;border-radius:20px;overflow:hidden;margin:16px 0}.fill{height:100%;background:#5b9ce0;width:0}button{font:inherit;font-weight:650;border:0;border-radius:10px;background:#2869c3;color:white;padding:12px 17px;cursor:pointer}button.alt{background:#eaf0f8;color:#24456e}button:disabled{opacity:.4}input{width:100%;font:inherit;font-size:18px;padding:14px;border:1.5px solid #b9c9dc;border-radius:10px;margin-top:12px}input:focus{outline:3px solid #d6e8ff}.sentence{font-size:clamp(20px,4vw,25px);line-height:1.6;margin:20px 0}.hint{background:#f1f6fc;padding:14px;border-radius:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.hidden{display:none}.muted{font-size:13px;color:#64748b}.result{border-left:4px solid #c95555}.result.ok{border-color:#2b996e}.answer{color:#1c60b7;font-weight:750}.nav{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:18px}.nav button{padding:9px 0;background:#eaf0f8;color:#36516d}.nav button.done{background:#d4e7ff}.nav button.active{background:#2869c3;color:white}.score{font-size:44px;font-weight:800}.small{font-size:13px}a{color:#2869c3}@media(max-width:500px){.card{padding:17px}.wrap{padding:16px 12px 40px}}</style></head><body><main class="wrap"><a href="../">← 返回練習首頁</a><header><p class="pill">國三英文 · 曲目 1＋曲目 10</p><h1>Vocabulary Spelling Challenge</h1><p>40 題｜英文例句挖空＋中文提示｜自行輸入完整拼字。交卷後顯示分數、答案與解析。</p></header>
<section class="card" id="intro"><h2>準備開始</h2><p>每題 2.5 分，總分 100 分。大小寫不影響評分，片語請完整輸入。可返回修改答案；未交卷前不顯示解答。</p><button onclick="start()">開始 40 題測驗</button></section>
<section class="card hidden" id="quiz"><div style="display:flex;justify-content:space-between"><strong id="counter"></strong><span class="muted" id="filled"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="sentence" id="sentence"></div><div class="hint" id="hint"></div><label for="answer" style="display:block;margin-top:20px;font-weight:650">輸入完整英文拼字／片語</label><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><div class="actions"><button class="alt" id="prev" onclick="move(-1)">上一題</button><button id="next" onclick="move(1)">下一題</button><button class="alt" onclick="submitQuiz()">交卷並查看成績</button></div><p class="muted">題號導覽（藍色代表已填答）</p><div class="nav" id="nav"></div></section>
<section id="results" class="hidden"><div class="card"><h2>測驗結果</h2><div class="score" id="score"></div><p id="summary"></p><div class="actions"><button onclick="retryWrong()" id="retry">錯題重練</button><button class="alt" onclick="showAll()">查看全部解析</button><button class="alt" onclick="restart()">重新測驗</button></div></div><div id="review"></div></section>
<p class="muted">本練習不需要登入，也不會將學生作答或成績傳送到伺服器。</p></main><script>
const bank=[["blanket","毯子","It's cold tonight. Could you give me a ______?","blanket 是可數名詞。"],["shy","害羞的","Lisa is very ______. She doesn't like speaking in front of many people.","shy 是形容詞。"],["north","向北","Many birds fly ______ in spring.","north 在此作副詞。"],["repeat","重複","I didn't hear you clearly. Could you ______ that?","Could you 後接原形動詞。"],["get married","結婚","My aunt and uncle plan to ______ next year.","get married 是固定片語。"],["tidy","整理","Please ______ your room before your friends arrive.","tidy 在此作動詞。"],["lonely","寂寞的","Kevin felt ______ when all his friends were away.","lonely 表示孤單的。"],["package","包裹","A ______ arrived at our house this morning.","package 是可數名詞。"],["queen","皇后","The ______ lived in a beautiful palace.","queen 是名詞。"],["stay up","熬夜","Don't ______ too late, or you'll be tired tomorrow.","stay up 是動詞片語。"],["correct","正確的","Your answer is ______. Well done!","correct 在此作形容詞。"],["language","語言","English is an important ______ around the world.","language 是名詞。"],["cheer up","振作起來","Don't be sad. ______! Everything will be fine.","cheer up 是動詞片語。"],["south","向南","The birds fly ______ when winter comes.","south 在此作副詞。"],["stupid","愚蠢的","It was ______ of him to leave his bag on the bus.","stupid 是形容詞。"],["national","國家的","The ______ flag is flying in front of the school.","national 是形容詞。"],["mind","介意","Do you ______ if I open the window?","Do you mind if...? 是常見句型。"],["keep in touch","保持聯繫","Let's ______ after we graduate from junior high school.","keep in touch 是固定片語。"],["power","力量","The superhero has the ______ to fly.","power 在此作名詞。"],["park","停車","You cannot ______ your car here.","park 在此作動詞。"],["class leader","班長","Our ______ helps the teacher collect homework.","class leader 是名詞片語。"],["item","品項","Each ______ on the shopping list has a number.","item 是可數名詞。"],["even though","即使","______ it was raining, we still went hiking.","even though 引導讓步子句。"],["grade","年級","My brother is in the ninth ______.","the ninth grade 是九年級。"],["wave","揮手","The children ______ to their parents when the bus leaves.","wave 在此作動詞。"],["quite","相當","This math problem is ______ difficult.","quite 是程度副詞。"],["head","朝……行進","We will ______ home after dinner.","head 在此作動詞。"],["letter","字母","The word 'cat' has three ______s.","題目已提供複數字尾 s。"],["course","課程","I signed up for an English ______ this summer.","course 是名詞。"],["miss","趕不上","Hurry up, or you'll ______ the bus!","miss the bus 表示沒趕上公車。"],["study","研究","Scientists ______ the behavior of wild animals.","study 在此作動詞。"],["deal","約定","We made a ______ to help each other with homework.","make a deal 表示達成協議。"],["sign","跡象","Dark clouds are a ______ that rain is coming.","sign 在此表示跡象。"],["as soon as","一……就……","I'll call you ______ I get home.","as soon as 引導時間子句。"],["country","鄉村","My grandparents live in the ______, far from the busy city.","the country 可表示鄉村。"],["date","約會","Jack asked Amy out on a ______.","date 在此作名詞。"],["sight","視線","The beautiful mountain came into ______ as we drove closer.","come into sight 是固定搭配。"],["part-time","兼職的","My sister has a ______ job at a coffee shop.","part-time 是形容詞。"],["count on","依靠","You can always ______ your best friends when you need help.","count on 是固定片語。"],["not only...but also...","不但……也……","She is ______ smart ______ kind. (請輸入完整連接詞組)","not only...but also... 連接平行成分。"]];let order=bank.map((_,i)=>i),answers={},at=0,wrongMode=false;
const $=id=>document.getElementById(id);
const norm=s=>(s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[‘’]/g,"'");
function isRight(i){let v=norm(answers[i]),w=norm(bank[i][0]);return v===w||(i===39&&["not only but also","not only...but also...","not only … but also …"].includes(v));}
function start(){order=bank.map((_,i)=>i);answers={};at=0;wrongMode=false;$("intro").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");render();}
function save(){answers[order[at]]=$("answer").value;}
function render(){const i=order[at],q=bank[i];$("counter").textContent="第 "+(at+1)+" / "+order.length+" 題";$("filled").textContent=order.filter(i=>(answers[i]||"").trim()).length+" 題已填";$("fill").style.width=((at+1)/order.length*100)+"%";$("sentence").textContent=q[2];$("hint").textContent="中文提示："+q[1];$("answer").value=answers[i]||"";$("prev").disabled=at===0;$("next").disabled=at===order.length-1;$("nav").innerHTML="";order.forEach((id,j)=>{let b=document.createElement("button");b.textContent=j+1;b.className=(answers[id]?"done ":"")+(at===j?"active":"");b.onclick=()=>{save();at=j;render()};$("nav").appendChild(b)});}
function move(d){save();at=Math.max(0,Math.min(order.length-1,at+d));render();$("answer").focus();}
$("answer").addEventListener("input",e=>{answers[order[at]]=e.target.value;$("filled").textContent=order.filter(i=>(answers[i]||"").trim()).length+" 題已填";});
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"&&at<order.length-1)move(1)});
function submitQuiz(){save();if(!confirm("確定交卷？交卷後才會公布正確答案。"))return;finish();}
function finish(){let right=order.filter(isRight).length;$("quiz").classList.add("hidden");$("results").classList.remove("hidden");$("score").textContent=(right*2.5).toFixed(1).replace(/\.0$/,"")+" / "+(order.length*2.5);$("summary").textContent="答對 "+right+" 題，錯誤或未答 "+(order.length-right)+" 題。";$("retry").disabled=right===order.length;showAll();window.scrollTo(0,0);}
function makeReview(ids){$("review").innerHTML="";ids.forEach(i=>{const q=bank[i],c=document.createElement("div");c.className="card result "+(isRight(i)?"ok":"");const h=document.createElement("strong");h.textContent="第 "+(i+1)+" 題 "+(isRight(i)?"✓":"✕");const s=document.createElement("p");s.textContent=q[2];const a=document.createElement("p");a.textContent="你的答案："+(answers[i]||"（未作答）");const k=document.createElement("p");k.className="answer";k.textContent="正確答案："+q[0];const n=document.createElement("p");n.textContent="解析："+q[3];c.append(h,s,a,k,n);$("review").append(c);});}
function showAll(){makeReview(bank.map((_,i)=>i));}
function retryWrong(){const misses=order.filter(i=>!isRight(i));if(!misses.length)return;order=misses;answers={};at=0;wrongMode=true;$("results").classList.add("hidden");$("quiz").classList.remove("hidden");render();window.scrollTo(0,0);}
function restart(){start();window.scrollTo(0,0);}
</script></body></html>
