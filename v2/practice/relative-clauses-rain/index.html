<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relative Clauses · Grammar Practice</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#21354c;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:20px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2eaf3;padding:12px 0 22px}.logo{font-weight:800;color:#245b9e}a{color:#316abd;text-decoration:none}.tag{background:#e9f2fe;color:#376ca8;padding:7px 12px;border-radius:30px;font-size:12px}h1{font-size:clamp(28px,6vw,40px);letter-spacing:-1px;margin:30px 0 8px}p{color:#63778d;line-height:1.7}.panel{background:white;border:1px solid #e1e9f2;border-radius:20px;padding:clamp(20px,5vw,36px);box-shadow:0 6px 24px #163a6010;margin-top:24px}.muted{color:#71859b;font-size:14px}.meter{height:8px;background:#e8f0fa;border-radius:30px;overflow:hidden;margin-top:16px}.meter>div{height:100%;background:#6e9dd9;transition:width .2s}.stem{font-size:21px;font-weight:700;line-height:1.65;white-space:pre-wrap;margin:20px 0 26px}.option{width:100%;text-align:left;display:flex;gap:14px;align-items:center;background:#fff;border:1.5px solid #dbe5f0;border-radius:13px;padding:16px;margin:10px 0;color:#263c54;font:inherit;cursor:pointer;line-height:1.5}.option[aria-pressed=true]{border-color:#3172c1;background:#eef5ff}.letter{display:grid;place-items:center;flex:none;width:30px;height:30px;background:#edf2f8;border-radius:9px;font-weight:700;color:#50719c}button.primary{background:#316abd;color:white;border:0;border-radius:12px;padding:15px 22px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}button.primary:disabled{background:#b5c3d5;cursor:default}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px;flex-wrap:wrap}button.secondary{border:1px solid #d5e2f0;background:white;border-radius:12px;padding:13px 18px;color:#39658c;font:inherit;cursor:pointer}.item{border-top:1px solid #e3ebf3;padding:18px 0}.item p{margin:6px 0}.good{color:#08754b}.bad{color:#a43b45}.hide{display:none}footer{color:#97a5b6;font-size:12px;text-align:center;margin-top:44px}@media(max-width:450px){.stem{font-size:19px}.option{padding:13px}.actions button{flex:1}}</style></head><body><main>
<header><a class="logo" href="../../../s/q7m2v9x4k8p3/">English Practice.</a><span class="tag">Grammar · Unit 5–6</span></header>
<h1>Relative Clauses</h1><p>關係子句文法選擇題｜共 40 題。作答完畢後統一顯示成績、正確答案與中文解析。</p>
<section id="play" class="panel"><div class="muted" id="step"></div><div class="meter"><div id="bar"></div></div><div class="stem" id="stem"></div><div id="opts"></div><div class="actions"><button class="secondary" id="prev">上一題</button><button class="primary" id="next" disabled>下一題</button></div></section>
<section id="result" class="panel hide"><div class="muted">Practice Complete</div><h2 id="score"></h2><p id="summary"></p><div id="review"></div><div class="actions"><button class="secondary" id="retry">全部重練</button><button class="primary" id="wrong">錯題重練</button></div></section>
<footer>English Practice · No login · Scores are not saved</footer></main><script>
const full=[["The woman _____ teaches us English is very friendly.",["which","who","where","whose"],1,"who 指人，並擔任 teaches 的主詞。"],["The bag _____ is under the chair belongs to Jack.",["who","whom","whose","which"],3,"which 指物品，並在子句中當主詞；that 也可以。"],["The boy who I met at the station is my cousin. 其中 who 是什麼？",["關係子句的主詞","主要子句的主詞","關係子句的受詞","所有格"],2,"I met the boy；who 代替 met 的受詞 the boy。"],["哪一句的關係代名詞能直接省略，不更動其他字？",["The boy who runs fast is my brother.","The movie which we watched was interesting.","The car which is parked outside is mine.","The students who study hard will pass."],1,"which 是 watched 的受詞，限定關係子句的受格關係代名詞可省略。"],["This is the most exciting game _____ I have ever played.",["who","where","what","that"],3,"先行詞有最高級修飾時，學校文法通常優先使用 that。"],["哪一句正確使用非限定關係子句？",["My father, who works in a hospital, likes music.","My father, that works in a hospital, likes music.","My father, works in a hospital, likes music.","My father, which works in a hospital, likes music."],0,"非限定關係子句以逗號隔開，指人可用 who，但不能用 that。"],["The girl who is dancing in the room is my sister. 選出正確簡化句。",["The girl danced in the room is my sister.","The girl dance in the room is my sister.","The girl dancing in the room is my sister.","The girl to dance in the room is my sister."],2,"主動關係子句 who is dancing 可簡化成 dancing。"],["The letter which was written by Emma arrived yesterday. 選出正確簡化句。",["The letter writing by Emma arrived yesterday.","The letter written by Emma arrived yesterday.","The letter wrote by Emma arrived yesterday.","The letter write by Emma arrived yesterday."],1,"被動關係子句 which was written 可簡化成過去分詞 written。"],["The boy who has curly hair is my classmate. 選出同義句。",["The boy in curly hair is my classmate.","The boy at curly hair is my classmate.","The boy on curly hair is my classmate.","The boy with curly hair is my classmate."],3,"with curly hair 用來描述具有捲髮的特徵。"],["The teacher who is wearing a green coat teaches science. 選出同義句。",["The teacher in a green coat teaches science.","The teacher at a green coat teaches science.","The teacher on a green coat teaches science.","The teacher from a green coat teaches science."],0,"in a green coat 可描述穿著綠色外套。"],["The students _____ are waiting outside belong to Class 3.",["which","whom","who","whose"],2,"students 是人，who 作 waiting 的主詞。"],["I found the keys _____ you lost yesterday.",["who","which","where","whose"],1,"keys 是物品，which 作 lost 的受詞，也可以用 that 或省略。"],["The dog _____ barks every night belongs to our neighbor.",["that","where","whom","whose"],0,"that 可以修飾動物，並在關係子句中作主詞。"],["The girl _____ father is a pilot speaks French.",["who","which","that","whose"],3,"whose 表示所有關係，whose father 是女孩的父親。"],["This is the school _____ I studied as a child.",["who","where","which","whose"],1,"where 表示在該地點，等於 at which 的地點用法。"],["The singer _____ songs are popular will perform tonight.",["whose","whom","which","where"],0,"whose songs 表示歌手的歌曲，使用所有格關係代名詞。"],["The woman _____ I spoke to was helpful.",["which","whose","who","where"],2,"who 指人，在 spoke to 後作受詞，可用 whom 或省略。"],["The books _____ are on the shelf are new.",["which","who","whom","whose"],0,"books 是物品，which 作 are 的主詞。"],["The boy who _____ near us is in my class.",["live","living","lives","have lived"],2,"先行詞 boy 是單數，關係子句動詞用 lives。"],["The children who _____ in the park are my cousins.",["plays","playing","is playing","are playing"],3,"children 是複數，進行式用 are playing。"],["請選出正確的關係子句句型。",["The man who he called me is kind.","The man who called me is kind.","The man which called me is kind.","The man who calling me is kind."],1,"who 已經是 called 的主詞，不需要再加 he。"],["The laptop _____ my dad bought last month is fast.",["who","whose","which","where"],2,"which 指 laptop，作 bought 的受詞。"],["哪一句的關係代名詞不能直接省略？",["The movie that I like is funny.","The cake which she made is tasty.","The girl who helped us is friendly.","The coat that he bought is black."],2,"who 是 helped 的主詞，不能只刪掉 who。"],["I like the song _____ we heard on the radio.",["who","that","whose","where"],1,"that 修飾 song，作 heard 的受詞。"],["The man _____ you saw yesterday is our principal.",["which","where","whose","whom"],3,"whom 用於指人的受格，在此是 saw 的受詞。"],["Everything _____ she told us was useful.",["that","who","where","whose"],0,"everything 是不定代名詞，課本文法常使用 that 引導關係子句。"],["This is the first story _____ I wrote in English.",["where","who","that","whose"],2,"先行詞有序數 first 修飾，學校文法通常選 that。"],["He is the only person _____ knows the answer.",["which","where","whose","that"],3,"the only 修飾先行詞時，課本文法偏好 that；且 that 在此作主詞。"],["The boy and his bicycle _____ were in the picture are gone.",["that","who","where","whose"],0,"先行詞同時含人與物時，課本文法通常選 that。"],["哪一句使用逗號和關係代名詞正確？",["My cat, that is very old, sleeps all day.","My cat, which is very old, sleeps all day.","My cat, which very old, sleeps all day.","My cat, who is very old sleeps all day."],1,"非限定關係子句可以使用 which，但不能使用 that，且需要成對逗號。"],["My aunt, _____ lives in Taichung, is a nurse.",["that","which","who","where"],2,"逗號表示補充說明，人用 who，非限定用法不能使用 that。"],["The boy _____ is wearing a blue cap is my friend.",["who","whom","where","whose"],0,"who 指人，擔任 is wearing 的主詞。"],["The man who is standing at the gate is my dad. 正確簡化為何？",["The man stood at the gate is my dad.","The man stand at the gate is my dad.","The man to stand at the gate is my dad.","The man standing at the gate is my dad."],3,"主動進行的 who is standing 可簡化為 standing。"],["The shoes which were made in Italy are expensive. 正確簡化為何？",["The shoes making in Italy are expensive.","The shoes made in Italy are expensive.","The shoes make in Italy are expensive.","The shoes to make in Italy are expensive."],1,"鞋子是被製造的，使用過去分詞 made 表被動。"],["The people who live nearby are friendly. 正確簡化為何？",["The people lived nearby are friendly.","The people to live nearby are friendly.","The people living nearby are friendly.","The people lives nearby are friendly."],2,"主動關係子句 who live 可簡化為 living。"],["The pictures that were painted by Anna look beautiful. 正確簡化為何？",["The pictures painted by Anna look beautiful.","The pictures painting by Anna look beautiful.","The pictures paint by Anna look beautiful.","The pictures paints by Anna look beautiful."],0,"pictures 是被 Anna 畫的，使用過去分詞 painted。"],["The girl who is wearing glasses is my sister. 正確改寫為何？",["The girl at glasses is my sister.","The girl on glasses is my sister.","The girl from glasses is my sister.","The girl with glasses is my sister."],3,"with glasses 表示戴眼鏡的特徵。"],["The boy who is in a white T-shirt is Kevin. 正確改寫為何？",["The boy with a white T-shirt is Kevin.","The boy in a white T-shirt is Kevin.","The boy at a white T-shirt is Kevin.","The boy from a white T-shirt is Kevin."],1,"in a white T-shirt 描述穿著白色 T 恤的男孩。"],["The woman who is from Japan works here. 正確改寫為何？",["The woman at Japan works here.","The woman with Japan works here.","The woman from Japan works here.","The woman on Japan works here."],2,"from Japan 表示來自日本，可直接作名詞後的修飾語。"],["The box which is under the bed is heavy. 正確改寫為何？",["The box under the bed is heavy.","The box with the bed is heavy.","The box into the bed is heavy.","The box from the bed is heavy."],0,"under the bed 是位置介系詞片語，可修飾 box。"]];let order=full.map((_,i)=>i),answers={},pos=0;
const $=id=>document.getElementById(id),abc=['A','B','C','D'];
function render(){const k=order[pos],q=full[k];$('step').textContent='Question '+(pos+1)+' of '+order.length;$('bar').style.width=((pos+1)/order.length*100)+'%';$('stem').textContent=q[0];$('opts').replaceChildren();q[1].forEach((v,i)=>{const b=document.createElement('button');b.className='option';b.setAttribute('aria-pressed',answers[k]===i?'true':'false');const l=document.createElement('span');l.className='letter';l.textContent=abc[i];const t=document.createElement('span');t.textContent=v;b.append(l,t);b.onclick=()=>{answers[k]=i;render()};$('opts').append(b)});$('prev').disabled=pos===0;$('next').disabled=answers[k]===undefined;$('next').textContent=pos===order.length-1?'交卷並查看成績':'下一題';}
$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<order.length-1){pos++;render()}else finish()};
function finish(){const correct=order.filter(i=>answers[i]===full[i][2]).length;$('play').classList.add('hide');$('result').classList.remove('hide');$('score').textContent=correct+' / '+order.length+' 題正確';$('summary').textContent='得分 '+Math.round(correct/order.length*100)+' 分。以下是全部題目的答案與解析。';$('review').replaceChildren();order.forEach((k,i)=>{const q=full[k],ok=answers[k]===q[2],div=document.createElement('div');div.className='item';const heading=document.createElement('strong');heading.textContent=(i+1)+'. '+q[0];const detail=document.createElement('p');detail.className=ok?'good':'bad';detail.textContent='你的答案：'+abc[answers[k]]+' · '+(ok?'正確':'待加強')+'｜正解：'+abc[q[2]]+' '+q[1][q[2]];const explanation=document.createElement('p');explanation.textContent='解析：'+q[3];div.append(heading,detail,explanation);$('review').append(div)});$('wrong').disabled=correct===order.length;window.scrollTo({top:0,behavior:'smooth'})}
function restart(indices){order=indices;answers={};pos=0;$('result').classList.add('hide');$('play').classList.remove('hide');render();window.scrollTo({top:0,behavior:'smooth'})}
$('retry').onclick=()=>restart(full.map((_,i)=>i));$('wrong').onclick=()=>restart(order.filter(i=>answers[i]!==full[i][2]));render();
</script></body></html>
